name: Fetch selected BGM

on:
  push:
    paths:
      - '.github/workflows/fetch-bgm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Resolve official Pixabay MP3 URL
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/resolve-bgm.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            await page.goto('https://pixabay.com/music/beats-midnight-dreaming-lofi-256436/', {
              waitUntil: 'domcontentloaded', timeout: 60000
            });
            await page.waitForTimeout(3500);

            const contentUrl = await page.evaluate(() => {
              const scripts = [...document.querySelectorAll('script[type="application/ld+json"]')];
              const find = value => {
                if (!value) return null;
                if (Array.isArray(value)) {
                  for (const entry of value) {
                    const hit = find(entry);
                    if (hit) return hit;
                  }
                  return null;
                }
                if (typeof value === 'object') {
                  if (typeof value.contentUrl === 'string' && value.contentUrl) return value.contentUrl;
                  for (const entry of Object.values(value)) {
                    const hit = find(entry);
                    if (hit) return hit;
                  }
                }
                return null;
              };

              for (const script of scripts) {
                try {
                  const hit = find(JSON.parse(script.textContent || '{}'));
                  if (hit) return hit;
                } catch (_) {}
              }
              return null;
            });

            await browser.close();
            if (!contentUrl) throw new Error('Pixabay MP3 contentUrl not found');
            fs.writeFileSync('/tmp/bgm-url.txt', contentUrl);
            console.log('Resolved official Pixabay audio URL.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          node /tmp/resolve-bgm.cjs

      - name: Download and validate MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          URL="$(cat /tmp/bgm-url.txt)"
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' -o assets/midnight-dreaming-lofi.mp3 "$URL"
          test -s assets/midnight-dreaming-lofi.mp3
          SIZE="$(wc -c < assets/midnight-dreaming-lofi.mp3)"
          if [ "$SIZE" -lt 100000 ]; then
            echo "Downloaded file is unexpectedly small: $SIZE bytes"
            exit 1
          fi
          file assets/midnight-dreaming-lofi.mp3

      - name: Commit BGM asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/midnight-dreaming-lofi.mp3
          if git diff --cached --quiet; then
            echo 'BGM asset already exists.'
            exit 0
          fi
          git commit -m 'Add Midnight Dreaming Lofi BGM asset'
          git push
