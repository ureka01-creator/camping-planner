name: Finalize BGM integration

on:
  push:
    paths:
      - '.github/workflows/fetch-bgm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire BGM and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          assert 'Camping Planner v0.7.7' in text
          assert './js/landing-safe.js?v=7' in text
          text = text.replace('Camping Planner v0.7.7', 'Camping Planner v0.7.8')
          text = text.replace('./js/landing-safe.js?v=7', './js/landing-safe.js?v=8')
          index.write_text(text)

          landing = Path('js/landing-safe.js')
          text = landing.read_text()
          if not text.startswith("import './bgm.js?v=2';"):
              text = "import './bgm.js?v=2';\n\n" + text
          landing.write_text(text)

          bootstrap = Path('js/bootstrap.js')
          text = bootstrap.read_text()
          assert 'Camping Planner v0.7.7' in text
          text = text.replace('Camping Planner v0.7.7', 'Camping Planner v0.7.8')
          bootstrap.write_text(text)
          PY

          test -s assets/midnight-dreaming-lofi.mp3
          git rm .github/workflows/fetch-bgm.yml

      - name: Commit final integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/landing-safe.js js/bootstrap.js js/bgm.js assets/midnight-dreaming-lofi.mp3
          git commit -m 'Enable Midnight Dreaming BGM v0.7.8'
          git push
