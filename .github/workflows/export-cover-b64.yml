name: Rebuild final landing poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-cover-b64.yml'
      - 'assets/cover-final-q35.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified JPEG
        run: |
          cat assets/cover-final-q35.part0 \
              assets/cover-final-q35.part1 \
              assets/cover-final-q35.part2 \
              assets/cover-final-q35.part3 \
              assets/cover-final-q35.part4 \
              assets/cover-final-q35.part5 \
            | tr -d '\r\n ' | base64 -d > assets/cover-main-approved.jpg

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          data = Path('assets/cover-main-approved.jpg').read_bytes()
          assert len(data) == 18857, len(data)
          assert data[:3] == b'\xff\xd8\xff', data[:8]
          assert data[-2:] == b'\xff\xd9', data[-8:]
          digest = hashlib.sha256(data).hexdigest()
          assert digest == 'ca503fe916ca7ad9b3774c79cdb07f63eca61920e18477bd5791e26a857e55e3', digest
          print('verified JPEG bytes:', len(data))
          print('sha256:', digest)
          PY

      - name: Commit verified JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cover-main-approved.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Restore verified landing poster JPEG"
          git push
