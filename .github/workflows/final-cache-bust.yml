name: Final BGM cache bust

on:
  push:
    paths:
      - '.github/workflows/final-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump bootstrap cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          assert './js/bootstrap.js?v=106' in text
          text = text.replace('./js/bootstrap.js?v=106', './js/bootstrap.js?v=107')
          path.write_text(text)
          PY
          git rm .github/workflows/final-cache-bust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust bootstrap cache for BGM v0.7.8'
          git push
