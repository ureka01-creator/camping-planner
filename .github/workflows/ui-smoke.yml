name: UI Smoke Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'qa/**'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

jobs:
  header-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/camping-qa-http.log 2>&1 &
          echo $! > /tmp/camping-qa-http.pid
          sleep 1

      - name: Run header smoke check
        run: node qa/run-header-smoke.mjs

      - name: Run Android responsive smoke check
        run: node qa/run-responsive-smoke.mjs

      - name: Run first entry smoke check
        run: timeout 120s node qa/run-first-entry-smoke.mjs

      - name: Run home dashboard smoke check
        run: timeout 120s node qa/run-home-dashboard-smoke.mjs

      - name: Run admin access smoke check
        run: timeout 120s node qa/run-admin-access-smoke.mjs

      - name: Run preparation hub smoke check
        run: timeout 90s node qa/run-items-hub-smoke.mjs

      - name: Run packing cost smoke check
        run: timeout 90s node qa/run-items-cost-smoke.mjs

      - name: Run settlement and payer smoke check
        run: timeout 120s node qa/run-settlement-smoke.mjs

      - name: Run two-client realtime sync smoke check
        run: timeout 120s node qa/run-realtime-sync-smoke.mjs

      - name: Run real app meal smoke check
        run: timeout 90s node qa/run-app-smoke.mjs

      - name: Run meal edit icon smoke check
        run: timeout 90s node qa/run-edit-icons-smoke.mjs

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-results
          path: |
            qa/header-smoke-result.png
            qa/first-entry-smoke-result.png
            qa/home-dashboard-smoke-result.png
            qa/admin-access-smoke-result.png
            qa/app-smoke-result.png
            qa/edit-icons-smoke-result.png
          if-no-files-found: ignore
