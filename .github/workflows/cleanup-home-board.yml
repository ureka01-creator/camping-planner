name: One-time Home Board Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-home-board.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove requested home board post
        run: node qa/cleanup-home-board.mjs
